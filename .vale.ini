# Vale configuration for this repo, copied from vale/vale.ini.template and trimmed to the
# languages the repo has. Keep the [formats] block. See vale/README.md for why it is required.

StylesPath = .vale/styles
MinAlertLevel = warning

[formats]
js = md
py = md
ts = md
tsx = md

[*.md]
BasedOnStyles = Standards

BlockIgnores = (?m)^(?:[^\x00-\x7F]️?[ \t]+\*\*.*(?:\r?\n|$))+

[*.{js,py,ts,tsx}]
BasedOnStyles = Standards

# Paragraph shape in comment blocks is not yet calibrated.
Standards.ParagraphLength = NO
